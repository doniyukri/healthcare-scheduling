server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location = /auth-api { proxy_pass http://auth-service:3001/graphql; }
  location = /schedule-api { proxy_pass http://schedule-service:3002/graphql; }
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
